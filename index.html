<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartridge — Local Game Launcher</title>
<style>
  :root{
    --bg:#14110f;
    --panel:#1d1815;
    --panel-hi:#26201b;
    --line:#3a322b;
    --paper:#e9e0d2;
    --paper-dim:#a89c88;
    --brass:#c98b3f;
    --brass-dim:#7d5a2e;
    --font-display:'Iowan Old Style','Palatino Linotype',Georgia,serif;
    --font-mono:'JetBrains Mono','Courier New',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--paper);
    font-family:var(--font-mono);}

  /* ---------- shell layout ---------- */
  #shell{display:flex;height:100vh;width:100vw;overflow:hidden;}

  /* ---------- sidebar / cartridge rack ---------- */
  #rack{
    width:280px;flex:0 0 280px;background:var(--panel);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    overflow-y:auto;
  }
  #rack-header{
    padding:22px 20px 16px;border-bottom:1px solid var(--line);
  }
  #rack-header h1{
    font-family:var(--font-display);font-size:22px;margin:0 0 4px;
    letter-spacing:0.5px;color:var(--paper);font-weight:600;
  }
  #rack-header p{margin:0;font-size:11px;color:var(--paper-dim);}

  #cart-list{list-style:none;margin:0;padding:10px;flex:1;}
  .cart{
    display:flex;align-items:center;gap:12px;
    padding:12px 12px;margin-bottom:6px;border-radius:6px;
    cursor:pointer;border:1px solid transparent;
    transition:background 120ms ease, border-color 120ms ease;
  }
  .cart:hover{background:var(--panel-hi);}
  .cart.active{background:var(--panel-hi);border-color:var(--brass-dim);}
  .cart-swatch{
    width:34px;height:34px;border-radius:4px;flex:0 0 34px;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-weight:700;font-size:14px;
    color:#14110f;
  }
  .cart-meta{min-width:0;}
  .cart-title{font-size:13px;color:var(--paper);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;}
  .cart-sub{font-size:10px;color:var(--paper-dim);margin-top:2px;}

  #rack-footer{padding:14px 20px;border-top:1px solid var(--line);}
  #add-game-btn{
    width:100%;padding:9px;background:transparent;border:1px dashed var(--line);
    color:var(--paper-dim);border-radius:6px;cursor:pointer;font-family:var(--font-mono);
    font-size:11px;
  }
  #add-game-btn:hover{border-color:var(--brass-dim);color:var(--paper);}

  /* ---------- main viewport ---------- */
  #main{flex:1;display:flex;flex-direction:column;min-width:0;}
  #topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel);
    font-size:12px;color:var(--paper-dim);
  }
  #topbar .now-playing{color:var(--paper);}
  #topbar .now-playing b{color:var(--brass);}
  #topbar-actions{display:flex;gap:8px;}
  #topbar-actions button{
    background:var(--panel-hi);border:1px solid var(--line);color:var(--paper);
    padding:6px 12px;border-radius:5px;cursor:pointer;font-family:var(--font-mono);
    font-size:11px;
  }
  #topbar-actions button:hover{border-color:var(--brass-dim);}

  #viewport{flex:1;position:relative;background:#000;}
  #game-frame{width:100%;height:100%;border:0;display:none;}
  #empty-state{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:40px;
  }
  #empty-state h2{font-family:var(--font-display);font-size:20px;color:var(--paper);
    margin:0 0 8px;font-weight:600;}
  #empty-state p{max-width:360px;color:var(--paper-dim);font-size:12px;line-height:1.6;}

  /* ---------- fullscreen tweak ---------- */
  #shell:fullscreen #rack{display:none;}
  #shell:fullscreen #topbar{display:none;}

  /* ---------- add-game modal ---------- */
  #modal-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;
    align-items:center;justify-content:center;z-index:10;
  }
  #modal-backdrop.open{display:flex;}
  #modal{
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    width:360px;padding:22px;
  }
  #modal h3{font-family:var(--font-display);margin:0 0 14px;font-size:16px;color:var(--paper);}
  #modal label{display:block;font-size:10px;color:var(--paper-dim);margin:12px 0 4px;}
  #modal input{
    width:100%;padding:8px 10px;background:var(--bg);border:1px solid var(--line);
    border-radius:4px;color:var(--paper);font-family:var(--font-mono);font-size:12px;
  }
  #modal-actions{display:flex;gap:8px;margin-top:18px;justify-content:flex-end;}
  #modal-actions button{
    padding:8px 14px;border-radius:5px;cursor:pointer;font-family:var(--font-mono);
    font-size:11px;border:1px solid var(--line);background:var(--panel-hi);color:var(--paper);
  }
  #modal-actions .primary{background:var(--brass-dim);border-color:var(--brass);color:#fff;}
</style>
</head>
<body>

<div id="shell">
  <aside id="rack">
    <div id="rack-header">
      <h1>Cartridge</h1>
      <p>local launcher — saves stay on this device</p>
    </div>
    <ul id="cart-list"></ul>
    <div id="rack-footer">
      <button id="add-game-btn" type="button">+ add a game</button>
    </div>
  </aside>

  <main id="main">
    <div id="topbar">
      <div class="now-playing" id="now-playing">nothing loaded</div>
      <div id="topbar-actions">
        <button id="reload-btn" type="button" title="Reload the current game">reload</button>
        <button id="fullscreen-btn" type="button" title="Fullscreen">fullscreen</button>
      </div>
    </div>
    <div id="viewport">
      <iframe id="game-frame" allow="fullscreen; gamepad; autoplay"></iframe>
      <div id="empty-state">
        <h2>No game loaded</h2>
        <p>Pick a cartridge from the rack, or add one — point it at the local folder or path where that game's <code>index.html</code> lives.</p>
      </div>
    </div>
  </main>
</div>

<div id="modal-backdrop">
  <div id="modal">
    <h3>Add a cartridge</h3>
    <label for="f-title">Title</label>
    <input id="f-title" type="text" placeholder="e.g. My Game">
    <label for="f-path">Path to its index.html</label>
    <input id="f-path" type="text" placeholder="./games/mygame/index.html">
    <label for="f-color">Swatch color</label>
    <input id="f-color" type="text" placeholder="#c98b3f" value="#c98b3f">
    <div id="modal-actions">
      <button id="modal-cancel" type="button">cancel</button>
      <button id="modal-save" type="button" class="primary">add</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   CARTRIDGE LAUNCHER
   - Each game is defined by { id, title, path, color }.
   - "path" points at wherever YOU keep that game locally —
     this launcher does not bundle or fetch any game content.
   - Games you add via the "+ add a game" button are remembered
     in this browser's localStorage under 'cartridge:library'.
   ========================================================= */

// Starter list — edit `path` for each to point at where you keep
// that game's own index.html on your machine / local server.
// These are placeholders; nothing is fetched until you set a real path.
const DEFAULT_GAMES = [
  { id: "ultrakill",        title: "ULTRAKILL",             path: "./games/ultrakill/Ultrakill-main/index.html", color: "#c94f3f" },
  { id: "buckshot",         title: "Buckshot Roulette",     path: "./games/buckshot/buckshot-main/index.html", color: "#8a1f1f" },
  { id: "ztype",            title: "zType Trainer",         path: "./games/ztype/ztype-trainer-main/index.html", color: "#3f8ac9" },
  { id: "hollow-knight",    title: "Hollow Knight",         path: "", color: "#5b5f7a" },
  { id: "silksong",         title: "Hollow Knight: Silksong", path: "", color: "#7a5b6f" },
  { id: "deltarune",        title: "Deltarune",             path: "", color: "#c9a23f" },
  { id: "undertale",        title: "Undertale",             path: "", color: "#c9433f" },
];

const LIB_KEY = "cartridge:library";

function loadLibrary(){
  try{
    const raw = localStorage.getItem(LIB_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ /* ignore corrupt storage */ }
  localStorage.setItem(LIB_KEY, JSON.stringify(DEFAULT_GAMES));
  return DEFAULT_GAMES.slice();
}
function saveLibrary(games){
  localStorage.setItem(LIB_KEY, JSON.stringify(games));
}

let games = loadLibrary();
let activeId = null;

const listEl = document.getElementById("cart-list");
const frame = document.getElementById("game-frame");
const emptyState = document.getElementById("empty-state");
const nowPlaying = document.getElementById("now-playing");

function initials(title){
  return title.split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
}

function render(){
  listEl.innerHTML = "";
  games.forEach(g=>{
    const li = document.createElement("li");
    li.className = "cart" + (g.id===activeId ? " active":"");
    li.innerHTML = `
      <div class="cart-swatch" style="background:${g.color||'#c98b3f'}">${initials(g.title)}</div>
      <div class="cart-meta">
        <div class="cart-title">${g.title}</div>
        <div class="cart-sub">${g.path ? "ready" : "no path set"}</div>
      </div>`;
    li.addEventListener("click", ()=>launch(g.id));
    listEl.appendChild(li);
  });
}

function launch(id){
  const g = games.find(x=>x.id===id);
  if(!g) return;
  if(!g.path){
    alert(`No path set for "${g.title}" yet. Click "+ add a game" to set (or re-set) its index.html path.`);
    return;
  }
  activeId = id;
  nowPlaying.innerHTML = `now playing: <b>${g.title}</b>`;
  frame.src = g.path;
  frame.style.display = "block";
  emptyState.style.display = "none";
  render();
}

document.getElementById("reload-btn").addEventListener("click", ()=>{
  if(activeId) launch(activeId);
});

document.getElementById("fullscreen-btn").addEventListener("click", ()=>{
  const shell = document.getElementById("shell");
  if(!document.fullscreenElement){
    shell.requestFullscreen?.();
  }else{
    document.exitFullscreen?.();
  }
});

/* ---------- add-game modal ---------- */
const backdrop = document.getElementById("modal-backdrop");
document.getElementById("add-game-btn").addEventListener("click", ()=>{
  backdrop.classList.add("open");
});
document.getElementById("modal-cancel").addEventListener("click", ()=>{
  backdrop.classList.remove("open");
});
document.getElementById("modal-save").addEventListener("click", ()=>{
  const title = document.getElementById("f-title").value.trim();
  const path = document.getElementById("f-path").value.trim();
  const color = document.getElementById("f-color").value.trim() || "#c98b3f";
  if(!title || !path){ alert("Give it a title and a path."); return; }
  const id = title.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
  const existing = games.find(g=>g.id===id);
  if(existing){ existing.path = path; existing.color = color; existing.title = title; }
  else{ games.push({ id, title, path, color }); }
  saveLibrary(games);
  render();
  backdrop.classList.remove("open");
  document.getElementById("f-title").value = "";
  document.getElementById("f-path").value = "";
});

/* =========================================================
   SHARED LOCAL SAVE HANDLING
   Each game is expected to read/write its own save data.
   Two patterns you can drop into any game you host locally:

   1) localStorage, namespaced per game:
        const KEY = "cartridge:<game-id>:save";
        localStorage.setItem(KEY, JSON.stringify(saveObject));
        const save = JSON.parse(localStorage.getItem(KEY) || "null");

      Because each iframe/page is same-origin with the launcher
      (when served from the same local server), these keys all
      live in one browser storage area — namespacing by game id
      keeps them from colliding.

   2) IndexedDB, one database per game (better for larger saves,
      e.g. screenshots or big JSON blobs):

        const dbReq = indexedDB.open("cartridge-<game-id>", 1);
        dbReq.onupgradeneeded = () => {
          dbReq.result.createObjectStore("saves");
        };
        dbReq.onsuccess = () => {
          const db = dbReq.result;
          const tx = db.transaction("saves", "readwrite");
          tx.objectStore("saves").put(saveObject, "slot1");
        };

   The launcher itself only tracks *metadata* (title, path,
   color) in "cartridge:library" — it never touches a game's
   actual save data. That keeps each game's save format fully
   under that game's own control.
   ========================================================= */

render();
</script>
</body>
</html>
