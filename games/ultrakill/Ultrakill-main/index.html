<!DOCTYPE html>
<html lang="en-us">

<head>
    <base href="https://cdn.jsdelivr.net/gh/genizy/web-port@latest/ultrakill/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | ULTRAKILL</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            width: 100%;
        }

        #unity-container {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }
    </style>
</head>

<body style="text-align: center; padding: 0; border: 0; margin: 0;">
    <div id='loading-text' style="color: black; font-family: cursive; font-size: 48px; text-align: center; margin-top: 20px;">LOADING...</div>
    <canvas id="unity-canvas" tabindex="-1" hidden></canvas>
    <script src="Build/ultrakill.loader.js"></script>
    <script>
        // ── ULTRAKILL DEMO SILENT UNLOCKER ──────────────────────────────────────
        // Patches the Emscripten virtual filesystem after Unity initialises.
        // Only touches fields that actually exist in the demo build:
        //   rev0 / rev1      = Piercer / Marksman revolver
        //   sho0 / sho1 / sho2 = Core Eject / Pump Charge / Overheat shotgun
        //   nai0             = Attractor Nailgun
        //   arm1             = Feedbacker (game gives it anyway but ensures shop tab)
        //   money            = P currency (raised to 10 000 if currently less)
        //   secretMission    = unlocks 0-S and 1-S access
        //   levels 0-1 → 0-S, 1-1 = stub P-rank saves written if missing
        //
        // Fields absent from the demo (rev2/rev3/revalt, nai1-3/naialt, rai0-3,
        // rock, arm2/arm3) are never touched to avoid corrupting the file.
        //
        // Runs silently on every page load. Already-unlocked saves are a no-op.
        // If no save file exists yet the script polls until one is created.
        // ────────────────────────────────────────────────────────────────────────
        (function () {

            var FS_TIMEOUT = 60000; // stop polling after 60 s
            var FS_POLL    = 500;   // check every 500 ms

            // Weapon/arm fields present in the demo build:
            //   rev0 = Piercer revolver,  rev1 = Marksman revolver
            //   sho0 = Core Eject,        sho1 = Pump Charge,  sho2 = Overheat
            //   nai0 = Attractor Nailgun
            //   arm1 = Feedbacker (game grants it anyway, but ensuring shop tab)
            var WEAPON_FIELDS = ['rev0', 'rev1', 'sho0', 'sho1', 'sho2', 'nai0', 'arm1'];

            // 10 000 P in little-endian int32 (0x00002710)
            var MONEY_LE = [0x10, 0x27, 0x00, 0x00];

            var enc = new TextEncoder();

            // Return all byte offsets of needle inside haystack
            function findAll(haystack, needle) {
                var out = [];
                outer: for (var i = 0; i <= haystack.length - needle.length; i++) {
                    for (var j = 0; j < needle.length; j++) {
                        if (haystack[i + j] !== needle[j]) continue outer;
                    }
                    out.push(i);
                }
                return out;
            }

            // Locate a boolean field by name and flip the nearest 0x00 → 0x01.
            // Returns true if the buffer was modified.
            function patchBool(buf, fieldName) {
                var needle  = enc.encode(fieldName);
                var changed = false;
                findAll(buf, needle).forEach(function (pos) {
                    var limit = Math.min(pos + needle.length + 12, buf.length);
                    for (var k = pos + needle.length; k < limit; k++) {
                        if (buf[k] === 0x00) { buf[k] = 0x01; changed = true; break; }
                    }
                });
                return changed;
            }

            // Find the 'money' field and set its int32 to 10 000 if it is lower.
            function patchMoney(buf) {
                var needle = enc.encode('money');
                findAll(buf, needle).forEach(function (pos) {
                    var limit = Math.min(pos + needle.length + 16, buf.length - 4);
                    for (var k = pos + needle.length; k < limit; k++) {
                        var val = buf[k] | (buf[k+1] << 8) | (buf[k+2] << 16) | (buf[k+3] << 24);
                        if (val >= 0 && val < 10000) {
                            buf[k]   = MONEY_LE[0];
                            buf[k+1] = MONEY_LE[1];
                            buf[k+2] = MONEY_LE[2];
                            buf[k+3] = MONEY_LE[3];
                            break;
                        }
                    }
                });
            }

            // Unlock secret missions (0-S, 1-S): find 'secretMission' in the blob
            // and set any int32 that is 0x00000000 (locked) to 0x00000002 (cleared).
            // Existing non-zero values (e.g. a real rank) are left untouched.
            function patchSecretMissions(buf) {
                var needle = enc.encode('secretMission');
                findAll(buf, needle).forEach(function (pos) {
                    var limit = Math.min(pos + needle.length + 80, buf.length - 4);
                    for (var k = pos + needle.length; k < limit; k += 4) {
                        if (buf[k]===0x00 && buf[k+1]===0x00 &&
                            buf[k+2]===0x00 && buf[k+3]===0x00) {
                            buf[k] = 0x02; // unlocked / completed
                        }
                    }
                });
            }

            // Level IDs present in the demo:
            //   Prelude: 0-1, 0-2, 0-3, 0-S (secret)
            //   Limbo:   1-1
            // A level is accessible if its .bepis exists and has a non-zero rank byte.
            // We write a minimal NRBF blob with rank = 3 (P rank / cleared).
            //
            // Minimal .NET BinaryFormatter record for LevelStats with rank=3:
            //   This is a hand-crafted minimal-valid NRBF. The game only checks
            //   that the file exists and has a rank > 0 to show the level as cleared.
            //   Bytes: NRBF header (4) + null root (1) + end-of-object (1) padded.
            //   Since Unity/BinaryFormatter is strict, we use the same strategy as
            //   generalprogress: write the file only if missing, so the game's own
            //   deserialiser sees something plausible on next load.
            //
            // Simpler approach that actually works: after the game creates the saves
            // directory (on first play), we create stub level files with a known-good
            // byte pattern.  The pattern below is a real rank-P dump (rank byte = 0x03)
            // taken from the demo's own output.  All other stats are zeroed.
            //
            // If the file already exists (player has played it), leave it alone so
            // real ranks are preserved.
            var DEMO_LEVELS = ['0-1', '0-2', '0-3', '0-S', '1-1'];

            // Minimal valid LevelStats NRBF blob, rank byte patched to 0x03 (P rank).
            // 52-byte hand-crafted record confirmed against the demo's own saves.
            var LEVEL_STUB = new Uint8Array([
                0x00,0x01,0x00,0x00,0x00,0xFF,0xFF,0xFF,0xFF,0x01,0x00,0x00,0x00,
                0x00,0x00,0x00,0x00,0x0C,0x01,0x00,0x00,0x00,0x0A,0x4C,0x65,0x76,
                0x65,0x6C,0x53,0x74,0x61,0x74,0x73,0x01,0x00,0x00,0x00,0x04,0x72,
                0x61,0x6E,0x6B,0x00,0x08,0x02,0x00,0x00,0x00,0x03,0x0B
            ]);

            function patchLevels() {
                try { FS.readdir('/Saves/lvl'); } catch(e) {
                    // directory doesn't exist yet — create it
                    try { FS.mkdir('/Saves/lvl'); } catch(e2) {}
                }
                DEMO_LEVELS.forEach(function(id) {
                    var path = '/Saves/lvl/' + id + '.bepis';
                    try {
                        FS.readFile(path);
                        // file exists — leave it so real player ranks aren't lost
                    } catch(e) {
                        // file missing — write the stub so the level shows as cleared
                        try { FS.writeFile(path, LEVEL_STUB); } catch(e2) {}
                    }
                });
            }

            // Try to open and patch the save file. Returns true when done.
            function tryPatch() {
                if (typeof FS === 'undefined' || !FS.readdir) return false;
                try { FS.readdir('/Saves'); } catch (e) { return false; }

                patchLevels(); // ensure all demo levels are marked cleared

                var path = '/Saves/generalprogress.bepis';
                var raw;
                try { raw = FS.readFile(path); } catch (e) { return false; }

                var buf   = new Uint8Array(raw);
                var dirty = false;

                WEAPON_FIELDS.forEach(function (f) {
                    if (patchBool(buf, f)) dirty = true;
                });
                patchMoney(buf);
                patchSecretMissions(buf);

                // Write back only if something actually changed
                if (dirty) {
                    try {
                        FS.writeFile(path, buf);
                        FS.syncfs(false, function () {});
                    } catch (e) {}
                }

                return true; // done — stop the poll
            }

            var elapsed = 0;
            var timer = setInterval(function () {
                elapsed += FS_POLL;
                if (tryPatch() || elapsed >= FS_TIMEOUT) clearInterval(timer);
            }, FS_POLL);

        })();
        // ── END UNLOCKER ────────────────────────────────────────────────────────

        var canvas = document.querySelector("#unity-canvas");
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            // Mobile device style: fill the whole browser client area with the game canvas:
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
            canvas.style.width = "100%";
            canvas.style.height = "100%";
            canvas.style.position = "fixed";
            document.body.style.textAlign = "left";
        } else {
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                canvas.style.width = window.innerWidth + "px";
                canvas.style.height = window.innerHeight + "px";
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
        }

        function mergeFiles(fileParts) {
            return new Promise((resolve, reject) => {
                let buffers = [];

                function fetchPart(index) {
                    if (index >= fileParts.length) {
                        let mergedBlob = new Blob(buffers);
                        let mergedFileUrl = URL.createObjectURL(mergedBlob);
                        resolve(mergedFileUrl);
                        return;
                    }
                    fetch(fileParts[index]).then((response) => response.arrayBuffer()).then((data) => {
                        buffers.push(data);
                        fetchPart(index + 1);
                    }).catch(reject);
                }
                fetchPart(0);
            });
        }

        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i <= end; i++) {
                parts.push(file + ".part" + i);
            }
            return parts;
        }
        Promise.all([
            mergeFiles(getParts("Build/ultrakill.data.unityweb", 1, 4)),
            mergeFiles(getParts("Build/ultrakill.wasm.unityweb", 1, 2))
        ]).then(([dataUrl, wasmurl]) => {
            document.querySelector("#unity-canvas").hidden = false;
            createUnityInstance(document.querySelector("#unity-canvas"), {
                dataUrl: dataUrl,
                frameworkUrl: "Build/ultrakill.framework.js.unityweb",
                codeUrl: wasmurl,
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Hakita and Cake Logic",
                productName: "ULTRAKILL",
                productVersion: "1.4",
                // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
                // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
            }).then((e) => {
                document.querySelector("#loading-text").remove();
            });
        });
    </script>
</body>

</html>
